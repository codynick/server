name: Classroom checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh install.sh
      - run: docker build -t codynick-classroom:0.2.0 -f runtime/Dockerfile .
      - name: Real runner check
        run: |
          sudo groupadd -f codynick-web
          sudo mkdir -p /run/codynick-server
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-server mariadb-client
          sudo systemctl start mariadb
          sudo python3 server/workspace_broker.py &
          for i in $(seq 1 20); do [ -S /run/codynick-server/runner.sock ] && break; sleep 1; done
          sudo python3 server/smoke.py
          sudo python3 tests/integration.py
      - name: Browser integration
        run: |
          sudo chown root:$(id -gn) /run/codynick-server/runner.sock
          pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-rpi-interface-screenshots
          path: screenshots/
