name: Classroom checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh install.sh
      - run: docker build -t codynick-classroom:0.1.0 runtime
      - name: Real runner check
        run: |
          sudo groupadd -f codynick-web
          sudo mkdir -p /run/codynick-server
          sudo python3 server/broker.py &
          for i in $(seq 1 20); do [ -S /run/codynick-server/runner.sock ] && break; sleep 1; done
          sudo python3 server/smoke.py
