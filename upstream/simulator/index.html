<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodyNick Simulator</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="stylesheet" href="/tool-navigation.css"></head>
<body><header><div><strong>CodyNick</strong><span>Gadget Simulator</span></div><a id="mainPanel" class="codynick-home-button" href="http://start.codynick/">Main Panel</a><span id="connection" role="status">Connecting</span></header>
<main><aside><h1>Gadgets</h1><div class="toolbox">
<button class="tool" draggable="true" data-add="seven" title="Drag onto stage or click to add"><img src="/seven-segment.svg" alt=""><span>Seven-segment</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="temperature" title="Drag onto stage or click to add"><img src="/sensor.png" alt=""><span>Temperature</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="matrix" title="Drag onto stage or click to add"><img src="/matrix.svg" alt=""><span>LED matrix</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="joystick" title="Drag onto stage or click to add"><img src="/joystick.png" alt=""><span>Joystick</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="ultrasonic" title="Drag onto stage or click to add"><img src="/ultrasonic.png" alt=""><span>Ultrasonic</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="soil" title="Drag onto stage or click to add"><img src="/soil.png" alt=""><span>Soil moisture</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="true" data-add="wifi" title="Drag onto stage or click to add"><img src="/wifi.png" alt=""><span>Wi-Fi / IoT</span><b aria-hidden="true">+</b></button></div>
<dl><dt>Python</dt><dd id="python">Waiting</dd><dt>Joystick</dt><dd id="direction">Neutral</dd><dt>Buzzer</dt><dd id="note">Silent</dd><dt>7-segment</dt><dd id="displayValue">Not added</dd></dl><button id="sound" title="Enable or mute simulated buzzer">Enable sound</button><p id="soundStatus" role="status"></p></aside>
<section class="workspace"><div class="toolbar"><span id="selected">CodyJoy Pro</span><button id="remove" title="Remove selected gadget" aria-label="Remove selected gadget" disabled>&#215;</button><button id="fit" title="Fit all gadgets in view">Fit stage</button><button id="actual" title="Show gadgets at actual size">1:1</button><span id="saved" role="status">Loading layout</span></div><p id="error" role="alert" hidden></p><div id="stageViewport"><div id="stage" aria-label="Gadget simulation stage">
<section class="stage-item" id="gadget-cjp" data-kind="cjp"><button class="handle" aria-label="Move CodyJoy Pro" title="Move CodyJoy Pro">CodyJoy Pro <span aria-hidden="true">&#10021;</span></button><div class="device"><img src="/gadget.svg" alt="CodyJoy Pro enclosure"><div id="leds" aria-label="16 RGB LEDs"></div><div class="joystick" aria-label="Simulated joystick"><button data-state="UP" title="Joystick up" aria-label="Joystick up">&#8593;</button><button data-state="LEFT" title="Joystick left" aria-label="Joystick left">&#8592;</button><button data-state="CLICK" title="Joystick click" aria-label="Joystick click">&#9679;</button><button data-state="RIGHT" title="Joystick right" aria-label="Joystick right">&#8594;</button><button data-state="DOWN" title="Joystick down" aria-label="Joystick down">&#8595;</button></div></div></section>
<section class="stage-item" id="gadget-seven" data-kind="seven" hidden><button class="handle" aria-label="Move seven-segment display" title="Move seven-segment display">Seven-segment <span aria-hidden="true">&#10021;</span></button><div class="seven-device"><img src="/seven-segment.svg" alt="Stand-Alone seven-segment display enclosure"><div id="sevenDigits" role="img" aria-label="Seven-segment display: blank"></div></div></section>
<section class="stage-item" id="gadget-temperature" data-kind="temperature" hidden><button class="handle" aria-label="Move temperature sensor" title="Move temperature sensor">Temperature sensor <span aria-hidden="true">&#10021;</span></button><div class="sensor-device"><img src="/sensor.png" alt="Simulated temperature probe"><div class="sensor-controls"><label for="temperatureValue">Temperature (&deg;C)</label><input id="temperatureValue" type="number" min="-55" max="125" step="0.1" value="21.1"><input id="temperatureSlider" type="range" min="-55" max="125" step="0.1" value="21.1" aria-label="Simulated temperature"></div></div></section>
<section class="stage-item" id="gadget-matrix" data-kind="matrix" hidden><button class="handle" aria-label="Move LED matrix" title="Move LED matrix">LED matrix <span aria-hidden="true">&#10021;</span></button><div class="matrix-device"><img src="/matrix.svg" alt="8 by 8 single-color LED matrix enclosure"><div id="matrixPixels" role="img" aria-label="8 by 8 LED matrix"></div></div><output id="matrixText"></output></section>
</div></div></section></main><script src="/font5x7.js"></script><script src="/app.js"></script></body></html>
